<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal RAG Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- View 1: Upload Card with API Key input integrated -->
    <div id="upload-card" class="panel">
        <h1>Upload PDF Document</h1>
        <p>Enter your Gemini API Key and select your PDF file to begin.</p>
        
        <div class="upload-form" style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; margin: 0 auto;">
            <input type="password" id="api-key-input" placeholder="Enter Gemini API Key..." style="padding: 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 14px;">
            <input type="file" id="pdf-file-input" accept=".pdf" style="padding: 6px 0;"> 
            <button id="start-button" type="button" style="padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;">Upload & Start Chat</button>
        </div>
    </div>

    <!-- View 2: Separate Chat Workspace -->
    <div id="chat-workspace" class="panel" style="display: none;">
        <div class="chat-header" style="display: flex; justify-content: space-between; align-items: center;">
            <button id="back-to-upload-btn" type="button" style="padding: 4px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 12px;">← Back</button>
            <h2>PDF RAG Assistant</h2>
            <span class="status-indicator">● Active</span>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask a question about your PDF...">
            <button id="send-button" type="button">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
