<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal RAG Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="upload-card" class="panel">
        <h1>Upload PDF Document</h1>
        <p>Enter your Gemini API key and select a PDF file to begin analysis.</p>
        <form id="upload-form" class="upload-form" style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin: 0 auto;">
            <input type="password" id="api-key" placeholder="Enter Gemini API Key..." required style="padding: 10px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; font-size: 14px; width: 100%;">
            <input type="file" id="pdf-file" accept=".pdf" required style="width: 100%;"> 
            <button id="start-button" type="submit" style="width: 100%; padding: 10px; cursor: pointer;">Upload & Start Chat</button>
        </form>
    </div>

    <div id="chat-workspace" class="panel" style="display: none;">
        <div class="chat-header">
            <button id="back-to-upload-btn" type="button">← Back</button>
            <h2>PDF RAG Assistant</h2>
            <span class="status-indicator">● Active</span>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask a question about your PDF..." autocomplete="off">
            <button id="send-button" type="submit">Send</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
